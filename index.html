<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Presensi Paskibra Real-Time</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Header Estetik dengan Logo Terapung di Tengah -->
    <header>
        <div class="header-logo" style="text-align: center; margin-bottom: 12px;">
            <img src="arb.png" alt="Logo Arunika Bumantara" style="width: auto; height: 200px; display: block; margin: 0 auto; filter: drop-shadow(0px 4px 8px rgba(0,0,0,0.25));">
        </div>
        <h1>ARUNIKA BUMANTARA</h1>
        <p>Sistem Informasi Absensi Latihan Rutin & Kegiatan Paskibra</p>
    </header>

    <!-- BARU & INTEGRASI: Panel Dasbor Persentase Kehadiran Bertema Lavender -->
    <div class="dashboard-stats">
        <div class="stat-card card-hadir">
            <h3>Hadir</h3>
            <p id="percentHadir">0%</p>
            <span id="countHadir" class="sub-count">0 Anggota</span>
        </div>
        <div class="stat-card card-izin">
            <h3>Izin</h3>
            <p id="percentIzin">0%</p>
            <span id="countIzin" class="sub-count">0 Anggota</span>
        </div>
        <div class="stat-card card-sakit">
            <h3>Sakit</h3>
            <p id="percentSakit">0%</p>
            <span id="countSakit" class="sub-count">0 Anggota</span>
        </div>
    </div>

    <!-- Kontainer Utama Layout Split-Screen -->
    <div class="container">
        
        <!-- BAGIAN KIRI: Formulir Input Kehadiran -->
        <div class="card-box">
            <div class="card-title">
                <span>Absen yuk!!!....</span>
            </div>
            
            <form id="attendanceForm">
                <div class="form-group">
                    <label for="tanggal">Tanggal Latihan</label>
                    <input type="date" id="tanggal" name="tanggal" required style="color-scheme: light;">
                </div>

                <div class="form-group">
                    <label for="nama">Nama Lengkap</label>
                    <input type="text" id="nama" name="nama" placeholder="Masukkan nama lengkap" required autocomplete="off">
                </div>

                <div class="form-group">
                    <label for="kelas">Kelas</label>
                    <input type="text" id="kelas" name="kelas" placeholder="Contoh: 71,82,93" required autocomplete="off">
                </div>

                <div class="form-group">
                    <label for="status">Status Kehadiran</label>
                    <select id="status" name="status" required>
                        <option value="Hadir">Hadir</option>
                        <option value="Izin">Izin</option>
                        <option value="Sakit">Sakit</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="keterangan">Keterangan</label>
                    <textarea id="keterangan" name="keterangan" rows="3" placeholder="Alasan jika izin/sakit, atau beri tanda (-) jika hadir"></textarea>
                </div>

                <button type="submit" id="btnSubmit" class="btn-submit">
                    <span id="btnText">Kirim Ke kang fauzi</span>
                    <div id="spinner" class="spinner hidden"></div>
                </button>
            </form>
            <div id="statusMessage" class="status-message hidden"></div>
        </div>

        <!-- BAGIAN KANAN: Tabel Riwayat Kehadiran + Kotak Cari Nama -->
        <div class="card-box">
            <div class="card-title">
                <span>Daftar Hadir Hari Ini</span>
                <button type="button" id="btnRefresh" class="btn-refresh" title="Segarkan Data">
                    <svg width="16" height="16" fill="currentColor" viewBox="0 0 16 16">
                        <path fill-rule="evenodd" d="M8 3a5 5 0 1 0 4.546 2.914.5.5 0 0 1 .908-.417A6 6 0 1 1 8 2v1z"/>
                        <path d="M8 4.466V.534a.25.25 0 0 1 .41-.192l2.36 1.966c.12.1.12.284 0 .384L8.41 4.658A.25.25 0 0 1 8 4.466z"/>
                    </svg>
                </button>
            </div>

            <!-- BARU: Kotak Input Pencarian Nama Anggota -->
            <div class="search-wrapper">
                <input type="text" id="searchName" placeholder="🔍 Cari nama anggota..." autocomplete="off">
            </div>
            
            <div class="table-wrapper">
                <table>
                    <thead>
                        <tr>
                            <th>Keterangan Anggota</th>
                            <th style="width: 35%; text-align: center;">Status & Tanggal</th>
                            <th style="width: 10%;"></th> 
                        </tr>
                    </thead>
                    <tbody id="tableBody">
                        <tr>
                            <td colspan="3" class="text-center text-muted">Memuat data presensi...</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>

    </div>

    <script src="script.js"></script>
</body>
</html>
